<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <form>
            <label for="nameInput">Emri:</label>
            <input type="text" id="nameInput">

            <label for="positionInput">Job Title:</label>
            <input type="text" id="positionInput">

            <label for="phoneInput">Phone Nr.</label>
            <input type="tel" id="phoneInput">

            <label for="emailInput">Email Address;</label>
            <input type="email" id="emailInput">

            <label for="webInput">Website</label>
            <input type="url" id="webInput">

            <label for="cityInput">Location</label>
            <input type="text" id="cityInput">
        </form>
    </div>

    <div class="card-preview">
        <h3 id="cardName"></h3>

        <h4 id="cardPosition"></h4>

        <p id="cardPhone"></p>

        <p id="cardEmail"></p>

        <p id="cardWeb"></p>

        <p id="cardCity"></p>
    </div>

    <script src="scripts.js"></script>
    
</body>
</html>
